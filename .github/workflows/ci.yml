name: CI

on:
  push:
    branches:
      - main
      - consolidation/architecture-baseline
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and tests
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Run launch-critical lint
        run: >-
          ruff check
          sentinel_alpha/macro_regime.py
          sentinel_alpha/macro_provenance.py
          sentinel_alpha/fred_ingestion.py
          sentinel_alpha/treasury_ingestion.py
          sentinel_alpha/database.py
      - name: Run tests
        run: pytest -q
