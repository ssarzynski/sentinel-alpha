name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: pip install -e .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd frontend && npm install
      - run: cd frontend && npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SEC_USER_AGENT: SentinelAlpha-CI/0.1 ci@example.com
      SEC_WATCHLIST: NVDA:1045810
      SEC_POLL_INTERVAL_SECONDS: 3600
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build application containers
        run: docker compose build backend sec-worker frontend
      - name: Start core stack
        run: docker compose up -d postgres redis backend frontend nginx
      - name: Wait for public health endpoint
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://localhost/api/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo 'Health endpoint did not become ready'
          docker compose ps
          docker compose logs --no-color backend nginx postgres redis frontend
          exit 1
      - name: Verify database migrations reached head
        run: docker compose exec -T backend alembic current
      - name: Start SEC worker and verify process
        run: |
          docker compose up -d sec-worker
          sleep 5
          test "$(docker inspect -f '{{.State.Running}}' $(docker compose ps -q sec-worker))" = "true"
      - name: Show service status
        run: docker compose ps
      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down stack
        if: always()
        run: docker compose down -v --remove-orphans
